{% extends 'base.html' %}

{% block title %}Confirm Deletion - The Cooking Nurse{% endblock %}

{% block content %}
<div class="page-container py-16 flex items-center justify-center min-h-[70vh]">
    <div class="glass-panel max-w-md w-full p-8 text-center rounded-2xl shadow-level-2 border border-white/20">
        <div class="text-error mb-4">
            <span class="material-symbols-outlined text-6xl">warning</span>
        </div>
        <h1 class="font-headline-md text-primary mb-2">Delete {{ type }}?</h1>
        <p class="text-on-surface-variant mb-6 text-sm">
            Are you absolutely sure you want to delete <strong>"{{ object }}"</strong>? This action is permanent and cannot be undone.
        </p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="flex gap-4 justify-center">
                <a href="{{ cancel_url }}" class="btn-primary py-2.5 px-6 rounded-full text-sm font-semibold transition-all">
                    Cancel
                </a>
                <button type="submit" class="btn-accent py-2.5 px-6 rounded-full text-sm font-semibold transition-all bg-error text-white hover:bg-error/95">
                    Yes, Delete Permanent
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
